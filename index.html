<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Speed Racer</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}.wrap{width:min(100vw,440px);padding:10px;text-align:center}h1{margin:3px 0 8px;font-size:25px;color:#67e8f9}.hud{display:flex;justify-content:space-around;font-weight:800;margin-bottom:8px}canvas{width:100%;height:auto;max-height:75dvh;touch-action:none;border:2px solid #334155;border-radius:14px;background:#1f2937}.controls{display:flex;gap:14px;margin-top:9px}.controls button{flex:1;background:#0e7490;color:white;border:0;border-radius:12px;font-size:27px;padding:12px;touch-action:none}#start{background:#22c55e;color:#052e16;font-weight:800;font-size:18px}small{color:#94a3b8}</style></head><body><div class="wrap"><h1>🏎️ SPEED RACER</h1><div class="hud"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div><canvas id="game" width="360" height="560"></canvas><div class="controls"><button id="left">◀</button><button id="start">START / RESTART</button><button id="right">▶</button></div><small>Hold ◀ ▶ or drag the car to dodge traffic</small></div><script>const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let player={x:160,y:465,w:40,h:72},enemies=[],score=0,best=0,running=false,last=0,spawn=0,road=0,dir=0,raf=0;try{best=+(localStorage.getItem('speedBest')||0)}catch(e){}bestEl.textContent=best;function car(x,y,w,h,color){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x+3,y+5,w,h);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.fillStyle='#b9e9ff';ctx.fillRect(x+7,y+12,w-14,13);ctx.fillRect(x+7,y+h-25,w-14,12);ctx.fillStyle='#fef08a';ctx.fillRect(x+4,y+3,8,5);ctx.fillRect(x+w-12,y+3,8,5);ctx.fillStyle='#ef4444';ctx.fillRect(x+4,y+h-7,8,5);ctx.fillRect(x+w-12,y+h-7,8,5)}function draw(){ctx.fillStyle='#14532d';ctx.fillRect(0,0,360,560);ctx.fillStyle='#303846';ctx.fillRect(38,0,284,560);ctx.fillStyle='#e2e8f0';ctx.fillRect(44,0,5,560);ctx.fillRect(311,0,5,560);ctx.fillStyle='#f8fafc';for(let y=-70+road%70;y<560;y+=70){ctx.fillRect(136,y,5,36);ctx.fillRect(223,y,5,36)}for(const e of enemies)car(e.x,e.y,e.w,e.h,e.color);car(player.x,player.y,player.w,player.h,'#22d3ee');if(!running){ctx.fillStyle='rgba(0,0,0,.64)';ctx.fillRect(38,180,284,180);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 27px system-ui';ctx.fillText(score?'GAME OVER':'READY TO RACE?',180,240);ctx.font='18px system-ui';ctx.fillText(score?'Score: '+Math.floor(score):'Avoid the cars!',180,280);ctx.fillText('Tap START below',180,320)}}function reset(){cancelAnimationFrame(raf);player.x=160;enemies=[];score=0;spawn=0;road=0;last=0;running=true;scoreEl.textContent='0';raf=requestAnimationFrame(loop)}function loop(t){if(!running)return;let dt=Math.min((t-last)/1000||0,.04);last=t;let speed=210+Math.min(score*1.6,230);player.x=Math.max(55,Math.min(265,player.x+dir*290*dt));road+=speed*dt;spawn-=dt;if(spawn<=0){let lanes=[75,160,245],x=lanes[Math.floor(Math.random()*3)];enemies.push({x,y:-85,w:40,h:72,color:['#f97316','#a78bfa','#fb7185','#facc15'][Math.floor(Math.random()*4)]});spawn=Math.max(.52,1.05-score/700)}for(let e of enemies)e.y+=speed*dt;enemies=enemies.filter(e=>e.y<590);score+=dt*10;scoreEl.textContent=Math.floor(score);for(let e of enemies){if(player.x+player.w-8>e.x+8&&player.x+8<e.x+e.w-8&&player.y+player.h-8>e.y+8&&player.y+8<e.y+e.h-8){running=false;dir=0;if(Math.floor(score)>best){best=Math.floor(score);bestEl.textContent=best;try{localStorage.setItem('speedBest',best)}catch(err){}}break}}draw();if(running)raf=requestAnimationFrame(loop)}document.getElementById('start').onclick=reset;function bind(id,d){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=d;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>dir=0);b.addEventListener('pointercancel',()=>dir=0)}bind('left',-1);bind('right',1);c.addEventListener('pointerdown',e=>{if(!running)return;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(running&&e.buttons)move(e)});function move(e){let r=c.getBoundingClientRect();player.x=Math.max(55,Math.min(265,(e.clientX-r.left)*360/r.width-20))}window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;if(e.key===' '&&!running)reset()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')dir=0});draw();</script></body></html>
